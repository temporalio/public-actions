name: 'PR description'
description: 'Fails when the pull request description still contains template placeholder lines or leaves a required section empty'
inputs:
  required-sections:
    description: >-
      Newline-separated section headings that must have content below them.
      Matching is case-insensitive; headings missing from the description are ignored.
    required: false
    default: |
      ## What changed?
      ## Why?
      ## How did you test it?
  github-token:
    description: 'Token used to read the pull request'
    required: false
    default: ${{ github.token }}
runs:
  using: "composite"
  steps:
    - name: Validate PR description
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        REQUIRED_SECTIONS: ${{ inputs.required-sections }}
        CHECK_SCRIPT: ${{ github.action_path }}/scripts/check.js
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { findViolations, parseSections } = require(process.env.CHECK_SCRIPT);

          // Re-read the PR so a re-run sees the latest description, not the triggering event's.
          const pr = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.payload.pull_request.number
          });

          const violations = findViolations(pr.data.body, parseSections(process.env.REQUIRED_SECTIONS));

          if (violations.length > 0) {
            console.log("❌ PR description issues found:");
            violations.forEach(v => console.log(`- ${v}`));
            core.setFailed(`PR description must not contain placeholders or empty sections.`);
          } else {
            console.log("✅ PR description passed all checks.");
          }
