name: Check for CODEOWNERS

on:
  # Runs on a pull request for the main branch. This uses
  # 'pull_request' rather than 'pull_request_target' because
  # the check needs no secrets or write access, and GitHub
  # blocks 'pull_request_target' in public repositories by
  # default.
  pull_request:
    types:
      # Default events
      - opened
      - synchronize
      - reopened
      # But we also want to make sure a potential
      # exception request pull request is getting
      # closed if any was open
      - closed
    branches:
      - main
      - master
  # Runs on a merge group build
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: false

jobs:
  check:
    name: Check for CODEOWNERS
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false && !endsWith(github.actor, '[bot]') }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Find doesn't return non-0 for no results, but grep does.
      - name: Check for CODEOWNERS
        run: |
          find . -iname "CODEOWNERS" | grep .
        
